<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Twitch Auto Claim</title>
  </head>
  <body>
    <header class="bar">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <h1>Auto claim</h1>
      <button id="master" class="master" type="button" role="switch" aria-checked="true">on</button>
    </header>

    <p class="alert" id="alert" hidden></p>
    <p class="scanbar" id="scanbar" hidden></p>

    <section class="block" aria-label="Claims">
      <div class="head"><span>claims</span><span id="colright"></span></div>
      <div id="rows"></div>
    </section>

    <section class="block" aria-label="Sweep">
      <div class="head"><span>sweep</span></div>
      <label class="row">
        <input type="checkbox" data-setting="autoSweep" />
        <span>Drops inventory, every</span>
        <select id="sweepInterval" aria-label="Sweep interval">
          <option value="30">30 min</option>
          <option value="60">60 min</option>
          <option value="120">2 h</option>
          <option value="240">4 h</option>
          <option value="720">12 h</option>
        </select>
      </label>
      <label class="row">
        <input type="checkbox" data-setting="sweepOnlyWithTwitch" />
        <span>Only while Twitch is open</span>
      </label>
      <p class="hint" id="lastSweep">no sweep yet</p>
    </section>

    <section class="block" aria-label="Click delay">
      <div class="row delay">
        <span>Click delay</span>
        <input type="range" id="delay" min="2" max="15" step="1" aria-label="Click delay in seconds" />
        <span class="mono" id="delayOut">2 to 4s</span>
      </div>
    </section>

    <footer>
      <button id="sweepNow" type="button" class="primary">Sweep now</button>
      <button id="scan" type="button">Scan</button>
      <button id="history" type="button">History</button>
    </footer>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
