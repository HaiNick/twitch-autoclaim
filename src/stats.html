<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="stats.css" />
    <title>Auto claim history</title>
  </head>
  <body>
    <main>
      <header class="top">
        <h1>Auto claim history</h1>
        <div class="range" id="range" role="group" aria-label="Time range">
          <button type="button" data-range="7">7d</button>
          <button type="button" data-range="30" class="on">30d</button>
          <button type="button" data-range="90">90d</button>
          <button type="button" data-range="0">all</button>
        </div>
      </header>

      <section class="summary" aria-label="Summary">
        <div class="lead">
          <span class="big" id="total">0</span>
          <span class="cap" id="totalCap">claims in 30 days</span>
        </div>
        <div class="side">
          <div><span id="today">0</span><small>today</small></div>
          <div><span id="rate">0</span><small>per active day</small></div>
          <div><span id="best">0</span><small>best day</small></div>
        </div>
      </section>

      <div class="strip" id="strip"></div>
      <div class="axis"><span id="from"></span><span id="hover">hover a day</span><span id="to"></span></div>

      <div class="split">
        <section aria-label="By claim type">
          <div class="head">by claim type</div>
          <div id="bars"></div>
        </section>
        <section aria-label="Where">
          <div class="head">where</div>
          <div class="sweepline" id="sweepline"></div>
          <div id="channels"></div>
        </section>
      </div>

      <section aria-label="Recent claims">
        <div class="head">recent</div>
        <div id="recent"></div>
      </section>

      <footer>
        <button id="clear" type="button">Clear history</button>
        <span class="hint" id="message"></span>
      </footer>
    </main>
    <script src="settings.js"></script>
    <script src="stats.js"></script>
  </body>
</html>
